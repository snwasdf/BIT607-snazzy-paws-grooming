<html lang="en">

<body>
    <header>
        <!-- logo/return to home page and website title -->

    <main>

        <!-- contact details and contact form section -->
        <h2>Contact Us</h2>

        <p><strong>Location:</strong> Hamilton, New Zealand</p>
        <p><strong>Phone:</strong> 123 456 7890</p>
        <p><strong>Email:</strong> snazzpawsgrooming@gmail.com</p>

        <form>
            <label for="full-name">Full Name: </label>
            <input type="text" id="full-name" name="full-name">

        <!-- map section -->
